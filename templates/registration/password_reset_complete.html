{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password changed" %} - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <h1 style="font-size:1.3rem">{% trans "Password changed" %}</h1>
    <p class="muted small">{% trans "Your new password is ready. Sign in with it now." %}</p>
    <p style="margin-top:1rem">
      <a class="btn btn-primary btn-block" href="{% url 'login' %}">{% trans "Go to sign in" %}</a>
    </p>
  </div>
</div>
{% endblock %}
