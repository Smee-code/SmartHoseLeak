{% comment %}Renders one form field with label, help text and errors.{% endcomment %}
<div class="field">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="field-inline">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
